name: space-explorer

services:
  setup:
    image: node:24-bookworm-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace

  web:
    image: node:24-bookworm-slim
    init: true
    working_dir: /app
    ports:
      - "127.0.0.1:${APP_PORT:-5176}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - type: bind
        source: ./app
        target: /app
        bind:
          create_host_path: false
      - node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  preview:
    image: node:24-bookworm-slim
    profiles: ["tools"]
    init: true
    working_dir: /app
    environment:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: preview
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-5177}:4173"
    volumes:
      - ./app:/app:ro
      - node_modules:/app/node_modules:ro
    command: ["npm", "run", "preview", "--", "--configLoader", "native", "--host", "0.0.0.0", "--port", "4173", "--strictPort"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  test:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["tools"]
    init: true
    ipc: host
    working_dir: /app
    environment:
      PLAYWRIGHT_BASE_URL: http://web:5173
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules:ro
    depends_on:
      web:
        condition: service_healthy
    command: ["npm", "run", "test:e2e"]

volumes:
  node_modules:
